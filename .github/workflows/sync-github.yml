name: Sync Academic Publication Archive

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run GitHub Ingestion & Catalog Normalizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:github

      - name: Run Automated Tests
        run: npm run test

      - name: Validate Showcase Catalog
        run: npm run validate:showcase -- --strict

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if catalog, showcase, or cached content changed
          if [[ -n $(git status --porcelain src/data/generated src/content/generated) ]]; then
            git add src/data/generated/catalog.json src/data/generated/showcase.json src/content/generated/works/ src/content/generated/showcase/
            git commit -m "chore(catalog): automated daily research and showcase sync [skip ci]"
            git push
            echo "Changes committed and pushed successfully."
          else
            echo "Catalogs and content are up to date. No commit necessary."
          fi

